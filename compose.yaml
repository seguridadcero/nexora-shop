services:
  nexora:
    build:
      context: .
      dockerfile: docker/single/Dockerfile
    ports:
      - '0.0.0.0:8090:80'
      - '0.0.0.0:8091:3001'
      - '0.0.0.0:8092:3010'
    volumes:
      - nexora_data:/data
      - supplier_data:/supplier-data
    extra_hosts:
      - 'internal-target:127.0.0.1'
      - 'supplier:127.0.0.1'
    restart: unless-stopped
    mem_limit: 768m
    cpus: 2.0
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 8
volumes:
  nexora_data: {}
  supplier_data: {}
