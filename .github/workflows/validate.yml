name: Validate Nexora Shop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: nexora-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify project source tree
        shell: bash
        run: |
          set -euo pipefail
          for file in compose.yaml package.json apps/api/package.json apps/storefront/package.json database/schema.sql; do
            if [ ! -f "$file" ]; then
              echo "::error title=Missing application sources::Missing $file"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build API
        run: npm run build -w @nexora/api
      - name: Build storefront
        run: npm run build -w @nexora/storefront
      - name: SQLite fixture tests
        run: npm run test:data
      - name: Check Compose
        run: docker compose config --quiet
      - name: Run containers
        run: docker compose up --build -d --wait
      - name: Verify single-container architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker compose ps -q | wc -l)" -eq 1
          docker compose ps
          curl -fsS http://127.0.0.1:8092/ -o /tmp/nexora-monitor.html
          curl -fsS http://127.0.0.1:8092/metrics -o /tmp/nexora-metrics.json
          curl -fsS -L http://127.0.0.1:8091/ -o /tmp/nexora-supplier.html
          grep -q 'Supplier Catalog' /tmp/nexora-supplier.html
          grep -q 'Price (USD)' /tmp/nexora-supplier.html
          curl -fsS http://127.0.0.1:8091/supplier/feed/products -o /tmp/nexora-supplier-feed.json
      - name: HTTP smoke tests
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8090/api/health
          curl -fsS http://127.0.0.1:8090/api/v1/products
          curl -fsS http://127.0.0.1:8090/api/openapi.json -o /tmp/nexora-openapi.json
          curl -fsS http://127.0.0.1:8090/api/docs -o /tmp/nexora-swagger.html
      - name: Verify ten OWASP API lab scenarios over HTTP
        run: node scripts/smoke.mjs
      - name: Controlled API4 load assessment
        run: node scripts/api4-load-test.mjs
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=100 || true
      - name: Cleanup
        if: always()
        run: docker compose down --volumes || true
